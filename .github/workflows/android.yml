name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/WILDLANDS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WILDLANDS-Android-APK
          path: build/WILDLANDS.apk
          if-no-files-found: error
          retention-days: 14
